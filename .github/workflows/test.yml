name: Testar sistema
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: npm run seed
      - name: Iniciar servidor e testar API
        run: |
          npm start > server.log 2>&1 &
          SERVER_PID=$!
          for i in {1..20}; do
            if curl --fail http://localhost:3000/api/health; then
              kill $SERVER_PID
              exit 0
            fi
            sleep 1
          done
          cat server.log
          kill $SERVER_PID || true
          exit 1
